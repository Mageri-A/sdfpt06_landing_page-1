             <section id="item5">
                 <div class="container">
                    <h4>Support Form</h4>
                        <form class="form" id="supportForm">
                      <div class="form-group">
                         <input type="text" id="studentName" class="form-control" placeholder="Enter Your Name">
                      </div>
                      <br>
                    <div class="form-group">
                         <input type="email" id="studentEmail" class="form-control" placeholder="Enter Your Email">
                      </div> 
                      <br>
                    <div class="form-group">
                         <label for="studentAttachment">Add an Attachment</label>
                         <input type="file" id="studentAttachment" class="form-control">
                      </div>
                      <br> 
                    <div class="form-group">
                         <select class="form-control" id="course">
                            <option value="html">HTML</option>
                            <option value="python">Python</option>
                            <option value="javascript">JavaScript</option>
                         </select>
                    </div>
                    <br>
                 <div class="form-check">
  <input class="form-check-input" type="checkbox" value="" id="termsChecked">
  <label class="form-check-label" for="termsChecked">
    I agree to terms and conditions
  </label>
</div>
                      <br>
                    <div class="form-group">
                        <input type="submit" value="Submit Form" class="btn btn-success">
                        <input type="reset" value="Reset Form" class="btn btn-danger">   
                    </div>
                    <br>
                </form>
